name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *' # nightly: picks up GitHub and dev.to changes
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch data, type-check and build
        run: npm run build
        env:
          # Optional fine-grained token (public repositories, read-only) for the
          # contribution calendar; falls back to the workflow token.
          GITHUB_TOKEN: ${{ secrets.GH_READ_TOKEN || github.token }}

      # Skipped until the Cloudflare secrets exist, so the build still runs as a check.
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=forsythfamous --branch=main --commit-hash=${{ github.sha }}
